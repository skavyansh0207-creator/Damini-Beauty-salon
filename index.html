<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Damini Beauty Salon | Luxury Salon & Spa Jalandhar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #0d0b0d;
      --card-bg: #181417;
      --rose-gold: #f3b0a0;
      --rose-bright: #ffd4cb;
      --gold: #f5b041;
      --text-white: #ffffff;
      --text-sub: #f0e6e4;
      --text-muted: #d1c2be;
      --border-color: rgba(243, 176, 160, 0.25);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }
    body {
      background-color: var(--bg);
      color: var(--text-white);
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      padding-bottom: 75px;
    }
    h1, h2, h3, .font-serif {
      font-family: 'Cormorant Garamond', serif;
    }

    /* Top Announcement Bar */
    .top-bar {
      background: #080608;
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      font-weight: 500;
    }
    .top-bar i {
      color: var(--rose-gold);
      margin-right: 6px;
    }
    .top-bar a {
      color: var(--rose-bright);
      text-decoration: none;
      font-weight: 700;
    }

    /* Hero Section with High Contrast Dark Overlay */
    .hero {
      position: relative;
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(180deg, rgba(13, 11, 13, 0.88) 0%, rgba(13, 11, 13, 0.94) 100%),
                  url('https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
    }
    .badge-rating {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--rose-gold);
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    .hero h1 {
      font-size: 3.6rem;
      letter-spacing: 2px;
      color: #ffffff;
      margin-bottom: 18px;
      text-transform: uppercase;
      font-weight: 700;
      text-shadow: 0 3px 20px rgba(0, 0, 0, 0.8);
      line-height: 1.15;
    }
    .hero h1 span {
      color: var(--rose-gold);
      font-style: italic;
    }
    .hero p {
      max-width: 680px;
      font-size: 1.15rem;
      color: var(--text-sub);
      font-weight: 500;
      line-height: 1.7;
      margin-bottom: 35px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }
    .hero-btn-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--rose-gold), #c97d6d);
      color: #120907;
      font-weight: 800;
      padding: 15px 32px;
      border-radius: 6px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 13px;
      box-shadow: 0 5px 25px rgba(243, 176, 160, 0.35);
      transition: 0.3s;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid var(--rose-gold);
      color: #ffffff;
      padding: 15px 32px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      transition: 0.3s;
    }
    .btn-secondary:hover {
      background: rgba(243, 176, 160, 0.15);
    }

    /* Common Section Wrap */
    .section-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 75px 20px;
    }
    .sec-header {
      text-align: center;
      margin-bottom: 45px;
    }
    .sec-header span {
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 12px;
      color: var(--rose-gold);
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .sec-header h2 {
      font-size: 2.8rem;
      letter-spacing: 1px;
      color: #ffffff;
    }

    /* Nail Extensions Gallery */
    .nails-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }
    .nail-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .nail-card:hover {
      transform: translateY(-6px);
      border-color: var(--rose-gold);
    }
    .nail-card img {
      width: 100%;
      height: 330px;
      object-fit: cover;
      display: block;
    }
    .nail-info {
      padding: 20px;
      text-align: center;
    }
    .nail-info h4 {
      font-size: 1.35rem;
      color: var(--rose-bright);
      margin-bottom: 6px;
    }
    .nail-info p {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Detailed Catalog Menu */
    .service-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
    }
